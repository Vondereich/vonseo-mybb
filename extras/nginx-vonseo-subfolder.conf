# VonSEO for a MyBB board installed at /forum/.
# Merge into this board's server {} block with its existing PHP handler and
# MyBB native friendly-URL rules. Replace EVERY /forum/ with your board path.
# Use nginx-vonseo.conf for a domain-root installation, never both snippets.
# This assumes server root points to the web-document root; do not use alias.

location = /forum/sitemap.xml {
    set $vonseo_sitemap_query "action=vonseo_sitemap";
    if ($args ~ "^type=(forums|threads|announcements|calendars|events)&page=([1-9][0-9]*)$") {
        set $vonseo_sitemap_query "action=vonseo_sitemap&type=$1&page=$2";
    }
    if ($args ~ "^page=([1-9][0-9]*)&type=(forums|threads|announcements|calendars|events)$") {
        set $vonseo_sitemap_query "action=vonseo_sitemap&type=$2&page=$1";
    }
    if ($args ~ "^type=(forums|threads|announcements|calendars|events)$") {
        set $vonseo_sitemap_query "action=vonseo_sitemap&type=$1";
    }
    rewrite ^ /forum/misc.php?$vonseo_sitemap_query? last;
}
location = /forum/robots.txt {
    rewrite ^ /forum/misc.php?action=vonseo_robots? last;
}

rewrite ^/forum/t-([1-9][0-9]*)-[^/]+--p([1-9][0-9]*)$ /forum/showthread.php?tid=$1&page=$2? last;
rewrite ^/forum/t-([1-9][0-9]*)-[^/]+--post-([1-9][0-9]*)$ /forum/showthread.php?tid=$1&pid=$2? last;
rewrite ^/forum/t-([1-9][0-9]*)-[^/]+--(lastpost|newpost|nextnewest|nextoldest)$ /forum/showthread.php?tid=$1&action=$2? last;
rewrite ^/forum/t-([1-9][0-9]*)-[^/]+$ /forum/showthread.php?tid=$1? last;
rewrite ^/forum/f-([1-9][0-9]*)-[^/]+--p([1-9][0-9]*)$ /forum/forumdisplay.php?fid=$1&page=$2? last;
rewrite ^/forum/f-([1-9][0-9]*)-[^/]+$ /forum/forumdisplay.php?fid=$1? last;

# Optional board-only fallback. Merge with an existing location /forum/.
# No request outside /forum/ is sent to the forum router.
location /forum/ {
    try_files $uri $uri/ @vonseo_forum_missing;
}
location @vonseo_forum_missing {
    rewrite ^ /forum/misc.php?action=vonseo_route? last;
}

# Host-root robots.txt is a separate site-owner choice. If another application
# already owns it, merge the forum's crawler directives into that site's file.
# Otherwise the site owner may add this block inside the same server {}:
# location = /robots.txt {
#     rewrite ^ /forum/misc.php?action=vonseo_robots? last;
# }
