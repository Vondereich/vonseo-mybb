# VonSEO for a MyBB board at the domain root.
# Merge into this board's server {} block, alongside its existing PHP handler
# and MyBB native friendly-URL rules. This is not a complete nginx.conf.
# For /forum/ use nginx-vonseo-subfolder.conf instead, never both snippets.

location = /sitemap.xml {
    set $vonseo_sitemap_query "action=vonseo_sitemap";
    if ($args ~ "^type=(forums|threads|announcements|calendars|events)&page=([1-9][0-9]*)$") {
        set $vonseo_sitemap_query "action=vonseo_sitemap&type=$1&page=$2";
    }
    if ($args ~ "^page=([1-9][0-9]*)&type=(forums|threads|announcements|calendars|events)$") {
        set $vonseo_sitemap_query "action=vonseo_sitemap&type=$2&page=$1";
    }
    if ($args ~ "^type=(forums|threads|announcements|calendars|events)$") {
        set $vonseo_sitemap_query "action=vonseo_sitemap&type=$1";
    }
    rewrite ^ /misc.php?$vonseo_sitemap_query? last;
}
location = /robots.txt {
    rewrite ^ /misc.php?action=vonseo_robots? last;
}

# Optional keyword routes. The final ? discards the original query string so
# incoming tid, fid, pid, page or action parameters cannot replace path values.
rewrite ^/t-([1-9][0-9]*)-[^/]+--p([1-9][0-9]*)$ /showthread.php?tid=$1&page=$2? last;
rewrite ^/t-([1-9][0-9]*)-[^/]+--post-([1-9][0-9]*)$ /showthread.php?tid=$1&pid=$2? last;
rewrite ^/t-([1-9][0-9]*)-[^/]+--(lastpost|newpost|nextnewest|nextoldest)$ /showthread.php?tid=$1&action=$2? last;
rewrite ^/t-([1-9][0-9]*)-[^/]+$ /showthread.php?tid=$1? last;
rewrite ^/f-([1-9][0-9]*)-[^/]+--p([1-9][0-9]*)$ /forumdisplay.php?fid=$1&page=$2? last;
rewrite ^/f-([1-9][0-9]*)-[^/]+$ /forumdisplay.php?fid=$1? last;

# Optional fallback. Merge try_files into an existing location / rather than
# defining that location twice. Keep native MyBB rewrites ahead of fallback.
# Real files/directories remain with their existing handlers.
location / {
    try_files $uri $uri/ @vonseo_missing;
}
location @vonseo_missing {
    rewrite ^ /misc.php?action=vonseo_route? last;
}
